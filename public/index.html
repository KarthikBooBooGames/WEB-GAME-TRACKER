<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>WebGL Line</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="styles.css?v=2">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230E9F8E'/%3E%3Cpath d='M11 8l14 8-14 8z' fill='white'/%3E%3C/svg%3E">
</head>
<body>

<div id="who" class="who" hidden>
  <div class="who-in">
    <div class="brand" style="justify-content:center;margin-bottom:14px"><span class="brand-mark">▶</span><span>WebGL Line</span></div>
    <h1>Who's this?</h1>
    <p>Pick yourself once. The board remembers.</p>
    <div class="who-grid" id="whoGrid"></div>
    <form id="passForm" class="pass" hidden>
      <label for="passIn">Team passcode</label>
      <input id="passIn" type="password" autocomplete="off" placeholder="Ask the producer">
      <button class="btn primary" type="submit">Open the board</button>
      <p class="pass-err" id="passErr" hidden>That passcode did not work. Try again.</p>
    </form>
  </div>
</div>

<header class="top">
  <div class="wrap top-in">
    <div class="brand"><span class="brand-mark">▶</span><span class="brand-name">WebGL Line</span></div>
    <span class="ship-pill num" id="shipPill"></span>
    <nav class="tabs" id="tabs">
      <button data-tab="today">Today</button>
      <button data-tab="week">Week</button>
      <button data-tab="games">Games</button>
      <button data-tab="settings" id="tabSettings" hidden>Plan</button>
    </nav>
    <span class="save" id="saveState"></span>
    <button class="me" id="meBtn" type="button" title="Switch person"><span class="avatar" id="meAv">?</span><span id="meName">—</span></button>
  </div>
  <div class="topbar"><i id="topbar" style="width:0"></i></div>
</header>
<main class="wrap" id="main"><div class="loading">Loading the board…</div></main>
<div class="toast" id="toast" hidden></div>
<canvas id="confetti" hidden></canvas>

<script src="config.js"></script>
<script src="seed.js?v=2"></script>
<script src="sched.js?v=2"></script>
<script src="app.js?v=2"></script>
</body>
</html>
